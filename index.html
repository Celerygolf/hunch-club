<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hunch Club</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center}
#app{width:min(100vw,430px);height:min(100vh,932px);position:relative;background:#000;overflow:hidden}
#screen{width:100%;height:100%;object-fit:cover;display:block}
.hot{position:absolute;border:0;background:transparent;padding:0;cursor:pointer}
.hot:active{background:rgba(255,210,40,.10)}
#msg{position:absolute;left:18px;right:18px;bottom:72px;text-align:center;font-size:12px;font-weight:700;color:#ffd83d;text-shadow:0 1px 3px #000;pointer-events:none}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.74);display:none;align-items:center;justify-content:center;padding:24px}
#modal .box{width:100%;border:1px solid #ffd83d;border-radius:20px;background:linear-gradient(#101722,#030609);padding:22px;text-align:center;box-shadow:0 0 40px rgba(255,210,50,.18)}
#modal .lock{font-size:56px}#modal h2{font-size:25px;margin:8px 0}#modal p{color:#d0d5dc;line-height:1.4}
.modalBtn{width:100%;padding:14px;border-radius:11px;border:0;margin-top:9px;font-weight:900}
.gold{background:linear-gradient(#ffe46b,#f1ae00);color:#111}.dark{background:#101923;color:#fff;border:1px solid #cbd1d8}
#name{position:absolute;left:35px;right:35px;top:210px;padding:12px;border-radius:7px;border:1px solid #d7a900;background:#08101a;color:#fff;display:none}
</style></head>
<body>
<div id="app">
<img id="screen" src="assets/home.jpg" alt="Hunch Club">
<div id="name"><input id="nameInput" placeholder="Your name" style="width:100%;background:transparent;border:0;color:white;outline:0"></div>
<div id="msg"></div>
<div id="modal"><div class="box"><div class="lock">🔒❤️</div><h2>Lock in your answer?</h2><p>You've chosen <b id="mchoice">YES</b>. Once locked, your prediction cannot be changed.</p><button class="modalBtn gold" id="confirm">🔒 LOCK IN MY HUNCH</button><button class="modalBtn dark" id="back">GO BACK</button></div></div>
</div>
<script>
const $=s=>document.querySelector(s), app=$("#app"), screen=$("#screen"), msg=$("#msg");
let page="home",session=null,pending=null;
const pages=["home","create","lobby","prediction","confirm","leaderboard","shield","progress","result","champion"];
function setPage(p){page=p;screen.src="assets/"+p+".jpg";msg.textContent="";document.querySelectorAll(".hot").forEach(x=>x.remove());bind(p)}
function button(x,y,w,h,fn){let b=document.createElement("button");b.className="hot";b.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%;`;b.onclick=fn;app.appendChild(b)}
function bind(p){
 if(p==="home"){
  button(8,48,84,10,()=>setPage("create"));
  button(8,58,84,9,()=>joinPrompt());
  button(0,0,100,100,()=>{}); // background remains inert except buttons added above
 }
 if(p==="create"){button(6,88,88,9,createGame);button(6,12,14,8,()=>setPage("home"))}
 if(p==="lobby"){button(7,82,88,9,startGame);button(6,6,13,8,()=>setPage("home"))}
 if(p==="prediction"){
  button(7,67,42,9,()=>choose("YES"));button(52,67,41,9,()=>choose("NO"));
  button(6,78,88,9,()=>{if(pending)openModal()});button(5,6,12,8,()=>setPage("lobby"))
 }
 if(p==="result"){button(7,88,88,8,()=>setPage("prediction"))}
 if(p==="champion"){button(7,88,88,8,()=>setPage("leaderboard"))}
}
function showMsg(s){msg.textContent=s}
function joinPrompt(){let c=prompt("Enter game code");let n=prompt("Your name");if(!c||!n)return;session={code:c.toUpperCase(),playerId:null,name:n};showMsg("Joining game…");join(n,c)}
async function api(action,payload={}){let r=await fetch("/api/game?action="+action,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload)});let j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");return j}
async function createGame(){let n=prompt("Your name");if(!n)return;try{let r=await api("create",{name:n});session=r;localStorage.setItem("hcSession",JSON.stringify(session));setPage("lobby");showMsg("Game created — code "+r.code)}catch(e){showMsg(e.message)}}
async function join(n,c){try{let r=await api("join",{name:n,code:c});session={...session,...r};localStorage.setItem("hcSession",JSON.stringify(session));setPage("lobby")}catch(e){showMsg(e.message)}}
async function startGame(){if(!session?.hostToken){setPage("prediction");return}try{await api("start",{code:session.code,hostToken:session.hostToken});setPage("prediction")}catch(e){showMsg(e.message)}}
function choose(c){pending=c;openModal()}
function openModal(){$("#mchoice").textContent=pending;$("#modal").style.display="flex"}
$("#back").onclick=()=>$("#modal").style.display="none";
$("#confirm").onclick=async()=>{try{if(session?.playerId){await api("pick",{code:session.code,playerId:session.playerId,choice:pending})}$("#modal").style.display="none";setPage("progress");showMsg("Hunch locked — "+pending)}catch(e){showMsg(e.message);$("#modal").style.display="none"}}
try{let s=localStorage.getItem("hcSession");if(s)session=JSON.parse(s)}catch{}
setPage("home");
</script></div></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hunch Club</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font:16px Arial,sans-serif}.app{max-width:560px;margin:auto;padding:32px 20px}.logo{text-align:center;color:#d7ad45;font-size:32px;font-weight:800;letter-spacing:3px}.tag{text-align:center;color:#aaa;margin:8px 0 30px}.card{background:#151515;border:1px solid #333;border-radius:18px;padding:24px;margin:0 0 18px}h2{margin-top:0}input{width:100%;padding:15px;margin:8px 0;border-radius:9px;border:1px solid #444;background:#222;color:white;font-size:16px}button{width:100%;padding:16px;margin:10px 0 0;border:0;border-radius:10px;background:#d7ad45;color:#111;font-size:17px;font-weight:bold;cursor:pointer}.secondary,.choice{background:#292929;color:white}.choice.selected{background:#d7ad45;color:#111}.hidden{display:none}.code{text-align:center;font-size:32px;letter-spacing:5px;color:#d7ad45;font-weight:bold}.small{text-align:center;color:#aaa}.person{padding:12px;margin:7px 0;background:#222;border-radius:8px}.question{text-align:center;font-size:23px;font-weight:bold;margin:22px 0}#message{color:#d7ad45;text-align:center;min-height:20px;margin:18px 0}</style></head><body><div class="app"><div class="logo">♛ HUNCH CLUB</div><div class="tag">Trust your gut. Stay in.</div>
<section id="home"><div class="card"><h2>Create a game</h2><input id="hostName" placeholder="Your name"><button id="create">CREATE GAME</button></div><div class="card"><h2>Join a game</h2><input id="playerName" placeholder="Your name"><input id="gameCode" placeholder="Game code" maxlength="6"><button id="join" class="secondary">JOIN GAME</button></div></section>
<section id="lobby" class="hidden"><div class="card"><div class="small">GAME LOBBY</div><div id="code" class="code"></div><div id="host" class="small"></div></div><div class="card"><h2>Players</h2><div id="players"></div></div><button id="start" class="hidden">START GAME</button><p id="wait" class="small">Waiting for the host to start the game…</p></section>
<section id="game" class="hidden"><div class="card"><div class="small">HUNCH 1 — TEST QUESTION</div><div class="question">Will there be a goal in the first half?</div><div class="small">This is a test question, not linked to a live match.</div><button class="choice" id="yes">YES</button><button class="choice" id="no">NO</button><p id="locked" class="small"></p></div><div class="card"><h2>Players</h2><div id="gamePlayers"></div></div></section><div id="message"></div></div>
<script>
const $=id=>document.getElementById(id);const show=id=>$(id).classList.remove('hidden');const hide=id=>$(id).classList.add('hidden');const message=s=>$('message').textContent=s||'';
let session=null, busy=false;
async function api(action,payload=null){const opts=payload?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)}:{};const url='/api/game?action='+encodeURIComponent(action)+(payload?'':'&code='+encodeURIComponent(session.code)+'&playerId='+encodeURIComponent(session.playerId));const r=await fetch(url,opts);let result;try{result=await r.json()}catch{throw Error('Backend unavailable. Check the Netlify Functions deployment.')}if(!r.ok)throw Error(result.error||'Request failed ('+r.status+')');return result;}
function save(){localStorage.setItem('hunchClubNetlifyV3',JSON.stringify(session))}
async function create(){if(busy)return;const name=$('hostName').value.trim();if(!name)return message('Enter your name.');busy=true;message('Creating game…');try{const r=await api('create',{name});session={code:r.code,playerId:r.playerId,hostToken:r.hostToken};save();lobby();}catch(e){message(e.message)}finally{busy=false}}
async function join(){if(busy)return;const name=$('playerName').value.trim(),code=$('gameCode').value.trim().toUpperCase();if(!name||!code)return message('Enter your name and game code.');busy=true;message('Joining game…');try{const r=await api('join',{name,code});session={code:r.code,playerId:r.playerId};save();lobby();}catch(e){message(e.message)}finally{busy=false}}
function lobby(){hide('home');hide('game');show('lobby');$('code').textContent=session.code;if(session.hostToken){show('start');hide('wait')}else{hide('start');show('wait')}message('');refresh()}
function game(){hide('home');hide('lobby');show('game');message('')}
function playersHtml(players){return players.map(p=>{const div=document.createElement('div');div.className='person';div.textContent='👤 '+p.name;return div.outerHTML}).join('')}
async function refresh(){if(!session)return;try{const state=await api('state');$('host').textContent='Host: '+state.hostName;const html=playersHtml(state.players);$('players').innerHTML=html;$('gamePlayers').innerHTML=html;if(state.status==='Started'){game();if(state.ownPick)locked(state.ownPick)}else if(!$('lobby').classList.contains('hidden')){}else lobby();}catch(e){message(e.message)}}
async function start(){if(!session?.hostToken)return;try{await api('start',{code:session.code,hostToken:session.hostToken});await refresh()}catch(e){message(e.message)}}
function locked(choice){$('yes').disabled=true;$('no').disabled=true;$(choice==='YES'?'yes':'no').classList.add('selected');$('locked').textContent='HUNCH LOCKED — Your prediction: '+choice}
async function pick(choice){try{const r=await api('pick',{code:session.code,playerId:session.playerId,choice});locked(r.choice)}catch(e){message(e.message)}}
$('create').onclick=create;$('join').onclick=join;$('start').onclick=start;$('yes').onclick=()=>pick('YES');$('no').onclick=()=>pick('NO');
try{session=JSON.parse(localStorage.getItem('hunchClubNetlifyV3')||'null');if(session?.code&&session?.playerId)lobby()}catch{}setInterval(()=>{if(session)refresh()},3000);
</script></body></html>
